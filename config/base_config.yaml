    debt_collection: |
      你是中国银行业信用卡外呼催收对话信息提取专家，专注于 M1 阶段（逾期 1-30 天）失业及其他困难类债务人的 SOP 本体挖掘。
      请根据文末的催收通话内容，严格按照下方提供的 Pydantic JSON Schema 输出结构化 JSON。

      Pydantic JSON Schema:
      `{schema}`

      ============================================================
      【九步主流程】
      ============================================================

        S1_RPCVerification          — 身份核实与合规披露
        S2_BalanceDisclosure        — 欠款金额披露
        S3_NeedsDiscovery           — 需求挖掘（★ 子流程分支点）
        S4_UrgencyCreation          — 后果说明与紧迫感
        S5_ArrangementNegotiation   — 方案协商（★ 唯一挂载 Outcome_*）
        S6_PTPCommitment            — 还款承诺确认
        S7_SkipTracing              — 联系方式更新（协商成功后）
        S8_ProfessionalInterruption — 客户不便时礼貌中断（协商未成时）
        S9_CallClose                — 复述、留号码、记录结果

      三条合法路径，先判定路径再填阶段：

        路径 A（协商成功）：S1 → S2 → S3 → [S4] → S5 → S6 → [S7] → S9
        路径 B（客户拒绝）：S1 → S2 → S3 → [S4] → S8
        路径 C（开场失败）：S1

      规则：
      - S1 与 S2 即使在同一段开场白里，也必须分别记两个节点。
      - S4 可跳过；出现施压话术才记 S4。
      - S7 与 S8 互斥，不共存。
      - 路径 B 以 S8 收尾，不再进入 S9；路径 C 以 S1 收尾。
      - 仅通话到达的最后一个阶段 next_master_stage 为 null。

      ============================================================
      【图连通性五条硬约束】
      ============================================================

      1. 严禁悬空引用：
         - rejoins_master_stage 必须引用 master_stages 中的主阶段（只能是 S4 及之后）。
         - triggered_in_step 必须引用 master_stages 中的主阶段。
         - satisfied_in_stage 可引用 master_stages 或 sub_steps 中已存在的节点。

      2. 主流程线性无环：master_stages 按 S1→S9 顺序、无重复。
         通话到达的最后一个阶段为 S9_CallClose 完成通话， next_master_stage 为 null。

      3. 禁止空节点：未进入分支时 branches_to_category 为 null，
         subflow_categories 与 sub_steps 为 []。不要输出空 extracted_info。

      4. 子流程隔离：
         - Flow_Unemployment 只能含：SubStep_Empathy_Verify, SubStep_Alt_Resources,
           SubStep_Hardship_Pitch, SubStep_Micro_Commitment。
         - Flow_Other 只能含：SubStep_Root_Cause, SubStep_Impact_Assess, SubStep_Custom_Pitch。
         - 分支固定从 S3_NeedsDiscovery 发生；parent_master_stage 恒为 "S3_NeedsDiscovery"。
         - **rejoins_master_stage 只能是 S4 及之后的阶段**
           （S4_UrgencyCreation / S5_ArrangementNegotiation / S6_PTPCommitment /
           S7_SkipTracing / S8_ProfessionalInterruption / S9_CallClose）。
           子流程是从 S3 分支出去的，不可能回挂到 S1/S2/S3。

      5. Outcome 挂载限定：stage_outcomes 只能出现在 S5_ArrangementNegotiation 上。

      6. 字段别串位（易错）：
         - branches_to_category（子流程分类，值形如 "Flow_Unemployment"）≠ next_master_stage
           （主阶段，值形如 "S4_UrgencyCreation"）。
         - 二者绝不混填；仅在 S3_NeedsDiscovery 上允许 branches_to_category 非空。

      ============================================================
      【字段格式强约束】
      ============================================================

      - master_stages[].required_compliance 是字符串数组，元素只能是：
        "Compliance_Verification" | "Compliance_Disclosure" | "Compliance_ExplicitConsent" | "Compliance_HardshipTerms"
        禁止写成 {{"artifact_id": "..."}} 或 {{"artifact_id": "...", "satisfied_in_stage": "..."}}。

      - compliance_artifacts 才是对象数组，元素形如：
        {{"artifact_id": "Compliance_Verification", "satisfied_in_stage": "S1_RPCVerification"}}

      - objections_raised[].triggered_in_step 只能填主阶段，例如 "S3_NeedsDiscovery"、
        "S5_ArrangementNegotiation"，禁止填 "SubStep_*"。

      ============================================================
      【示例 1：路径 A —— 协商成功，达成微承诺】
      ============================================================

      {{
        "master_stages": [
          {{
            "stage_id": "S1_RPCVerification",
            "next_master_stage": "S2_BalanceDisclosure",
            "required_compliance": ["Compliance_Verification", "Compliance_Disclosure"]
          }},
          {{
            "stage_id": "S2_BalanceDisclosure",
            "next_master_stage": "S3_NeedsDiscovery"
          }},
          {{
            "stage_id": "S3_NeedsDiscovery",
            "next_master_stage": "S5_ArrangementNegotiation",
            "branches_to_category": "Flow_Unemployment"
          }},
          {{
            "stage_id": "S5_ArrangementNegotiation",
            "next_master_stage": "S6_PTPCommitment",
            "stage_outcomes": ["Outcome_MicroCommitment"]
          }},
          {{
            "stage_id": "S6_PTPCommitment",
            "next_master_stage": "S9_CallClose"
          }},
          {{
            "stage_id": "S9_CallClose",
            "next_master_stage": null
          }}
        ],
        "subflow_categories": [
          {{
            "category_id": "Flow_Unemployment",
            "parent_master_stage": "S3_NeedsDiscovery",
            "initial_sub_step": "SubStep_Empathy_Verify"
          }}
        ],
        "sub_steps": [
          {{
            "sub_step_id": "SubStep_Empathy_Verify",
            "parent_category": "Flow_Unemployment",
            "extracted_info": ["失业"],
            "next_sub_step": "SubStep_Hardship_Pitch"
          }},
          {{
            "sub_step_id": "SubStep_Hardship_Pitch",
            "parent_category": "Flow_Unemployment",
            "extracted_info": ["申请减免违约金"],
            "next_sub_step": "SubStep_Micro_Commitment"
          }},
          {{
            "sub_step_id": "SubStep_Micro_Commitment",
            "parent_category": "Flow_Unemployment",
            "extracted_info": ["承诺明天还515元"],
            "next_sub_step": null,
            "rejoins_master_stage": "S5_ArrangementNegotiation"
          }}
        ],
        "compliance_artifacts": [
          {{ "artifact_id": "Compliance_Verification", "satisfied_in_stage": "S1_RPCVerification" }},
          {{ "artifact_id": "Compliance_Disclosure",   "satisfied_in_stage": "S1_RPCVerification" }}
        ],
        "objections_raised": [
          {{
            "objection_id": "Objection_Financial_Hardship",
            "triggered_in_step": "S3_NeedsDiscovery"
          }}
        ]
      }}

      ============================================================
      【示例 2：路径 B —— 施压后挂断，未进入 S5, 以 S9 收尾】
      ============================================================

      {{
        "master_stages": [
          {{
            "stage_id": "S1_RPCVerification",
            "next_master_stage": "S2_BalanceDisclosure",
            "required_compliance": ["Compliance_Verification", "Compliance_Disclosure"]
          }},
          {{
            "stage_id": "S2_BalanceDisclosure",
            "next_master_stage": "S3_NeedsDiscovery"
          }},
          {{
            "stage_id": "S3_NeedsDiscovery",
            "next_master_stage": "S4_UrgencyCreation",
            "branches_to_category": "Flow_Unemployment"
          }},
          {{
            "stage_id": "S4_UrgencyCreation",
            "next_master_stage": "S8_ProfessionalInterruption"
          }},
          {{
            "stage_id": "S8_ProfessionalInterruption",
            "next_master_stage": "S9_CallClose"
          }},
          {{
            "stage_id": "S9_CallClose",
            "next_master_stage": null
          }}
        ],
        "subflow_categories": [
          {{
            "category_id": "Flow_Unemployment",
            "parent_master_stage": "S3_NeedsDiscovery",
            "initial_sub_step": "SubStep_Empathy_Verify"
          }}
        ],
        "sub_steps": [
          {{
            "sub_step_id": "SubStep_Empathy_Verify",
            "parent_category": "Flow_Unemployment",
            "extracted_info": ["客户敷衍未承诺"],
            "next_sub_step": null,
            "rejoins_master_stage": "S4_UrgencyCreation"
          }}
        ],
        "compliance_artifacts": [
          {{ "artifact_id": "Compliance_Verification", "satisfied_in_stage": "S1_RPCVerification" }},
          {{ "artifact_id": "Compliance_Disclosure",   "satisfied_in_stage": "S1_RPCVerification" }}
        ],
        "objections_raised": [
          {{
            "objection_id": "Objection_Financial_Hardship",
            "triggered_in_step": "S3_NeedsDiscovery"
          }}
        ]
      }}

      ============================================================
      【示例 3：路径 B 变体 —— 客户不便，经过 S8 并以 S9 收尾，无子流程】
      ============================================================

      {{
        "master_stages": [
          {{
            "stage_id": "S1_RPCVerification",
            "next_master_stage": "S2_BalanceDisclosure",
            "required_compliance": ["Compliance_Verification", "Compliance_Disclosure"]
          }},
          {{
            "stage_id": "S2_BalanceDisclosure",
            "next_master_stage": "S3_NeedsDiscovery"
          }},
          {{
            "stage_id": "S3_NeedsDiscovery",
            "next_master_stage": "S8_ProfessionalInterruption"
          }},
          {{
            "stage_id": "S8_ProfessionalInterruption",
            "next_master_stage": "S9_CallClose"
          }},
          {{
            "stage_id": "S9_CallClose",
            "next_master_stage": null
          }}
        ],
        "subflow_categories": [],
        "sub_steps": [],
        "compliance_artifacts": [
          {{ "artifact_id": "Compliance_Verification", "satisfied_in_stage": "S1_RPCVerification" }},
          {{ "artifact_id": "Compliance_Disclosure",   "satisfied_in_stage": "S1_RPCVerification" }}
        ],
        "objections_raised": []
      }}

      催收对话内容:
      `{chunk}`

  decomposition:
    general: "You are a professional question decomposition expert specializing in\
      \ multi-hop reasoning.\nGiven the following ontology and the question, decompose\
      \ the complex question into 2-3 focused sub-questions and identify involved schema types.\n\nCRITICAL REQUIREMENTS:\n\
      1. Each sub-question must be:\n   - Specific and focused on a single fact or\
      \ relationship by identifing all entities, relationships, and reasoning steps\
      \ needed\n   - Answerable independently with the given ontology\n   - Explicitly\
      \ reference entities and relations from the original question\n   - Designed\
      \ to retrieve relevant knowledge for the final answer\n\n2. For simple questions\
      \ (1-2 hop), return the original question as a single sub-question\n3. Analyze the question and identify all schema types that might be involved\n4. Only return\
      \ a concise JSON object with sub_questions array and involved_types object.\n\nOntology:\n{ontology}\n\n\
      Question: {question}\n\nExample for complex question:\nOriginal: \"Which film\
      \ has the director died earlier, Ethnic Notions or Gordon Of Ghost City?\"\n\
      Output:\n{{\n  \"sub_questions\": [\n    {{\"sub-question\": \"Who is the director of Ethnic Notions?\"\
      }},\n    {{\"sub-question\": \"Who is the director of Gordon Of Ghost City?\"\
      }},\n    {{\"sub-question\": \"When did the director of Ethnic Notions die?\"\
      }},\n    {{\"sub-question\": \"When did the director of Gordon Of Ghost City\
      \ die?\"}}\n  ],\n  \"involved_types\": {{\n    \"nodes\": [\"creative_work\", \"person\"],\n    \"relations\": [\"directed_by\"],\n    \"attributes\": [\"name\", \"date\"]\n  }}\n}}\n\nExample for simple question:\nOriginal: \"What is the capital\
