    debt_collection:   |
      你是信用卡外呼催收对话信息提取专家。请根据催收通话内容，参考以下债务催收本体 schema，提取对话阶段、债务人画像、异议类别、说服策略、话术模板、合规规则等关键信息，并严格按照示例返回 JSON 格式。

      催收对话内容:
      `{chunk}`

      参考 schema:
      `{schema}`

      要求：

      1. 识别对话阶段（如 Opening_Verification、Debt_Acknowledgment、Hardship_Exploration、Negotiation、Commitment_PTP、Closing）。
      2. 识别债务人画像（如 Agreeable、Driver、Thinker、Defensive、Apathetic、Worried、Emotional、Intellectual、Circumstantial）。
      3. 识别异议类别（如 Financial_Hardship、Dispute_Fee_Concern、Third_Party_Approval、Call_Frequency_Complaint、Outright_Refusal）。
      4. 识别说服策略（如 Reciprocity、Commitment_Consistency、Social_Proof、Authority、Liking、Scarcity、Strategic_Silence、Concession_Management）。
      5. 提取话术模板与合规规则（如 FDCPA Mini-Miranda、录音告知、不威胁等）。
      6. **【核心限制：仅限 Schema 抽象概念】在提取实体类型和关系时，绝对禁止提取具体的客户身份信息（如客户姓名、电话、身份证号、具体账户）和具体的支付细节（如具体金额数值、具体还款日期）。必须强制将信息抽象为 Schema 概念级别。**
      7. 实体名称应直接使用 Schema 中定义的规范类别名称或抽象概念标签（例如使用 `Objection_Financial_Hardship` 代替“我被裁员了”；使用 `Commitment_PTP` 代替“明天转500”），禁止将对话中包含具体隐私或金额的原话提取为实体。
      8. 根据提供的 schema 为每个实体分配正确的类型。

      注意：严格抽取 triple 三元组为 [实体, 关系, 实体]，不要多余元素。

      示例输出，包括属性、三元组、实体类型及新模式类型：
      {{
      "attributes": {{
      "Call_2317941550352385028": ["call_date: 20260506", "talk_time: 613", "overdue_bucket: M1"]
      }},
      "triples": [
      ["Call_2317941550352385028", "has_next_stage", "Stage_Opening_Verification"],
      ["Stage_Hardship_Exploration", "triggered_in_stage", "Objection_Financial_Hardship"],
      ["Persona_Worried", "susceptible_to", "Strategy_Reciprocity"]
      ],
      "entity_types": {{
      "Call_2317941550352385028": "collection_call",
      "Stage_Opening_Verification": "dialogue_stage",
      "Objection_Financial_Hardship": "objection_category",
      "Persona_Worried": "debtor_persona",
      "Strategy_Reciprocity": "persuasion_strategy"
      }}
      }}

    debt_collection_agent:    |
      你是中国银行业信用卡外呼催收对话 SOP 挖掘专家，专注于 M1 阶段（逾期 1-30 天）失业类债务人的催收标准作业流程提取。请根据文末提供的催收通话内容，并参考以下 DCSPO（Debt Collection Sales Pitch Ontology）本体 schema，提取对话阶段、债务人画像、异议类别、说服策略、话术模板等关键信息，并重点挖掘 SOP 步骤、决策点与失业场景应对策略，严格按照示例返回 JSON 格式。

      参考 schema（重要：最大限度使用本体中已定义的类与关系）:
      `{schema}`


      要求：

      1. 识别对话阶段（DialogueStage 实例，如 Opening_Verification、Debt_Acknowledgment、Hardship_Exploration、Negotiation、Commitment_PTP、Closing），并用 `hasNextStage` 表达阶段顺序。
      2. 识别债务人画像（DebtorPersona 实例，如 Agreeable、Driver、Thinker、Defensive、Apathetic、Worried、Emotional、Intellectual、Circumstantial），并用 `susceptibleTo` 关联到 PersuasionStrategy。
      3. 识别异议类别（ObjectionCategory 实例，如 Financial_Hardship、Dispute_Fee_Concern、Third_Party_Approval、Call_Frequency_Complaint、Outright_Refusal），**重点关注失业导致的财务困难**；用 `triggeredInStage` 关联到 DialogueStage，用 `resolvedBy` 关联到 PersuasionStrategy。
      4. 识别说服策略（PersuasionStrategy 实例，如 Reciprocity、Commitment_Consistency、Social_Proof、Authority、Liking、Scarcity、Strategic_Silence、Concession_Management），用 `instantiates` 关联到 SalesPitchTemplate，用 `alignsWithPersona` 关联到 DebtorPersona。
      5. 提取话术模板（SalesPitchTemplate 实例）与合规规则（ComplianceRule 实例）；合规通过 `requiresCompliance`（DialogueStage → ComplianceRule）、`governsStage`、`restrictsStrategy` 表达，**不使用任何未在本体中定义的合规引用关系**。
      6. **【SOP 挖掘核心】** 提取 M1 阶段失业类债务人的标准作业流程，包括：
         - 失业状态确认与核实
         - 还款意愿与还款能力评估
         - 可提供的援助方案（延期、分期、减免）及适用条件
         - 承诺还款（PTP，PaymentCommitment 实例）的获取与确认
         - 后续跟进安排与时间节点（SystemEvent 实例，用 `precedes` / `follows` 表达顺序）
         - 升级或转接条件
         注意：DCSPO 本体未定义专门的 SOP 类与关系，如确有价值可放入 `new_schema_types`（见第 11 条）。
      7. 失业场景使用 `dcspo:hasHardship` 关联债务人（Debtor）与 HardshipEvent；`causedBy` 表达异议或困难的成因。
      8. **【核心限制：仅限 Schema 抽象概念】** 提取实体类型和关系时，绝对禁止提取具体的客户身份信息（姓名、电话、身份证号、具体账户）和具体的支付细节（金额数值、还款日期）。必须强制抽象到 Schema 概念级别。
      9. 实体名称应直接使用 DCSPO 中定义的规范类别名称或抽象概念标签（例如使用 `Objection_Financial_Hardship` 代替“我被裁员了”；使用 `Commitment_PTP` 代替“明天转500”），禁止将对话中包含具体隐私或金额的原话提取为实体。
      10. 根据 DCSPO 本体为每个实体分配正确的类型；triples 中的关系名必须严格来自上述 31 个对象属性。
      11. 模式演化：若发现新的重要实体类型、关系类型或属性类型对 SOP 挖掘有价值，请放入 `new_schema_types`。严格阈值 0.9，须同时满足重要性与与现有模式的低相似性。

      注意：严格抽取 triple 三元组为 [实体, 关系, 实体]，不要多余元素。

      示例输出（含属性、SOP 步骤、三元组、实体类型及新模式类型；JSON 花括号已转义）：
      {{
      "attributes": {{
      "Call_2317941550352385028": [
      "callId: 2317941550352385028",
      "callDate: 20260506",
      "talkTime: 613",
      "overdueBucket: M1"
      ]
      }},
      "sop_steps": [
      "确认失业状态",
      "评估还款意愿与能力",
      "提供延期/分期/减免方案",
      "获取 PTP 承诺",
      "安排后续跟进"
      ],
      "triples": [
      ["Call_2317941550352385028", "hasNextStage", "Stage_Opening_Verification"],
      ["Call_2317941550352385028", "targetsDebtor", "Debtor_Anonymous"],
      ["Call_2317941550352385028", "requiresCompliance", "Compliance_Recording_Notice"],
      ["Debtor_Anonymous", "hasHardship", "Hardship_Unemployment"],
      ["Debtor_Anonymous", "exhibitsTrait", "Persona_Worried"],
      ["Objection_Financial_Hardship", "triggeredInStage", "Stage_Hardship_Exploration"],
      ["Objection_Financial_Hardship", "resolvedBy", "Strategy_Reciprocity"],
      ["Persona_Worried", "susceptibleTo", "Strategy_Reciprocity"],
      ["Strategy_Reciprocity", "instantiates", "Template_Empathy_Then_Option"],
      ["Template_Empathy_Then_Option", "addressesObjection", "Objection_Financial_Hardship"],
      ["Strategy_Reciprocity", "alignsWithPersona", "Persona_Worried"],
      ["Call_2317941550352385028", "agreedTo", "Commitment_PTP"]
      ],
      "entity_types": {{
      "Call_2317941550352385028": "collection_call",
      "Stage_Opening_Verification": "dialogue_stage",
      "Stage_Hardship_Exploration": "dialogue_stage",
      "Debtor_Anonymous": "debtor",
      "Persona_Worried": "debtor_persona",
      "Objection_Financial_Hardship": "objection_category",
      "Strategy_Reciprocity": "persuasion_strategy",
      "Template_Empathy_Then_Option": "sales_pitch_template",
      "Compliance_Recording_Notice": "compliance_rule",
      "Hardship_Unemployment": "hardship_event",
      "Commitment_PTP": "payment_commitment"
      }},
      "new_schema_types": {{
      "nodes": ["sop_process", "sop_step"],
      "relations": ["includesStep", "followedByStep"],
      "attributes": ["stepOrder", "entryCondition", "exitCondition"]
      }}
      }}

      催收对话内容:
      `{chunk}`

    debt_collection_agent_pydantic: |
      你是中国银行业信用卡外呼催收对话信息提取专家，专注于 M1 阶段（逾期 1-30 天，delinquencyStage = "M1"）非自愿失业类债务人的 SOP 挖掘。
      请根据文末的催收通话内容，严格按照下方提供的 Pydantic JSON Schema 输出结构化 JSON，不得添加 Schema 之外的字段。

      Pydantic JSON Schema（源自 M1-Unemployment Debt Recovery Domain & Dialogue Ontology）:
      `{schema}`

      ============================================================
      【输出总则】
      ============================================================

      1. 严格遵循 Schema：字段名、枚举值、嵌套结构必须与 Schema 完全一致，不得拼写偏差。
      2. 枚举字段只能取 Schema 中 `enum` 列出的值（区分大小写）。
      3. 必填字段不可缺失；可选字段无值时省略或 null。
      4. 输出根对象为 `DebtCollectionExtraction`，**只有三个字段**：
        `master_stages`、`sub_stages`、`compliance_artifacts`。
      5. **不要**输出 `call` / `debtor` / `agent` / `account` / `financial_profile`
        等实例层对象 —— 它们已从 Schema 移除，通话级身份对 SOP 挖掘无贡献。
      6. 纯 JSON，不含任何解释、前缀、Markdown 代码块标记。

      ============================================================
      【本體層 —— 必須完整填充 SOP 骨架】
      ============================================================

      `master_stages` 必须包含通话中**实际走过**的所有主阶段，并用
      `next_master_stage` 串成链：

        Stage_1_Opening
          → Stage_2_RPC
          → Stage_3_Inquiry
          → Stage_4_ApplyPressure
          → Stage_5_WorkoutSolution
          → Stage_6_PushPTP
          → Stage_7_Closing

      除链末端外，每个阶段的 `next_master_stage` 必须填下一阶段。
      **通话实际停在哪一阶段，链就在该阶段结束** —— 不要伪造未发生的后续阶段。

      若通话进入 M1-失业子流程（`Stage_3_Inquiry` 分支）：

        Stage_3_Inquiry.branches_to_sub_stage = SubStage_3_1_EmpathyPivot
        sub_stages 中按顺序填充：
          SubStage_3_1_EmpathyPivot      → next_sub_stage = SubStage_3_2_FinancialProfiling
          SubStage_3_2_FinancialProfiling → next_sub_stage = SubStage_3_3_CardUtility
          SubStage_3_3_CardUtility.rejoins_master_stage = Stage_5_WorkoutSolution

      `compliance_artifacts` 必须包含通话中涉及的所有合规检查点。
      每个阶段 / 子阶段的 `requires_compliance` 必须列出该节点应满足的合规要求。

      ============================================================
      【類型層 —— 把通話信號掛到本體節點上】
      ============================================================

      原 `Call` 對象上的信號已上移到本體層。請按以下規則填充：

      ▸ `handles_rfd`  —— 「這個階段通常處理什麼困難原因？」
          掛在**處理失業原因的階段 / 子階段**上。
          M1-失业场景一律填 `["RFD_InvoluntaryUnemployment"]`。
          通常出現在 `Stage_3_Inquiry` 及其子階段。

      ▸ `yields_outcome` —— 「這個階段通常導向什麼結果？」
          掛在**產生最終結果的階段 / 子階段**上。
          可取 `"PromiseToPay"`、`"ForbearanceAgreement"`、`"MicroCommitment"`。
          例：通话产生 PTP → `Stage_6_PushPTP.yields_outcome = ["PromiseToPay"]`；
              通话给失业宽限 → 对应的 workout 子阶段 `yields_outcome = ["ForbearanceAgreement"]`。

      ▸ `requires_compliance` —— 「這個階段要求哪些合規檢查？」
          掛在**需要合規檢查的階段**上。
          例：`Stage_1_Opening.requires_compliance = ["Req_Verification", "Req_MiniMiranda"]`。

      ⚠ 不要输出以下字段（已从 Schema 移除）：
          `current_master_stage` / `current_sub_stage` / `detected_rfd` /
          `logged_compliance` / `is_verification_passed` / `call` / `debtor`。
          它們的語義已經由上面三條本體層邊表達。

      ============================================================
      【PII 保護 —— 已內建於 Schema】
      ============================================================

      Schema 已移除所有 PII / 金額 / 日期 / 自由文字字段。你只需按 Schema 填寫
      剩餘字段即可。**不要**在 label 字段中寫入人名、電話、身份證號、銀行卡號
      或任何具體金額。

      label 字段應填寫該節點的**概念描述**，例如：
        MasterSOPStage.stage_id = "Stage_1_Opening"
        MasterSOPStage.label    = "開場白、錄音告知與本人身份核實"

      ============================================================
      【示例輸出】
      ============================================================

      {{
        "master_stages": [
          {{
            "stage_id": "Stage_1_Opening",
            "label": "開場白、錄音告知與本人身份核實",
            "next_master_stage": "Stage_2_RPC",
            "branches_to_sub_stage": null,
            "requires_compliance": ["Req_Verification", "Req_MiniMiranda"],
            "handles_rfd": [],
            "yields_outcome": []
          }},
          {{
            "stage_id": "Stage_2_RPC",
            "label": "本人接觸並確認其知曉逾期",
            "next_master_stage": "Stage_3_Inquiry"
          }},
          {{
            "stage_id": "Stage_3_Inquiry",
            "label": "問詢逾期原因",
            "next_master_stage": "Stage_4_ApplyPressure",
            "branches_to_sub_stage": "SubStage_3_1_EmpathyPivot",
            "handles_rfd": ["RFD_InvoluntaryUnemployment"]
          }},
          {{
            "stage_id": "Stage_4_ApplyPressure",
            "label": "溫和提示繼續跟進",
            "next_master_stage": "Stage_5_WorkoutSolution"
          }},
          {{
            "stage_id": "Stage_5_WorkoutSolution",
            "label": "先還部分金額並申請減免",
            "next_master_stage": "Stage_6_PushPTP"
          }},
          {{
            "stage_id": "Stage_6_PushPTP",
            "label": "鎖定還款時限",
            "next_master_stage": "Stage_7_Closing",
            "yields_outcome": ["PromiseToPay"]
          }},
          {{
            "stage_id": "Stage_7_Closing",
            "label": "禮貌結束通話"
          }}
        ],
        "sub_stages": [
          {{
            "substage_id": "SubStage_3_1_EmpathyPivot",
            "label": "對失業困難表達理解與共情",
            "next_sub_stage": "SubStage_3_2_FinancialProfiling",
            "handles_rfd": ["RFD_InvoluntaryUnemployment"]
          }},
          {{
            "substage_id": "SubStage_3_2_FinancialProfiling",
            "label": "評估失業後資金流動性",
            "next_sub_stage": "SubStage_3_3_CardUtility",
            "handles_rfd": ["RFD_InvoluntaryUnemployment"]
          }},
          {{
            "substage_id": "SubStage_3_3_CardUtility",
            "label": "指引還款渠道並保留憑證",
            "rejoins_master_stage": "Stage_5_WorkoutSolution",
            "yields_outcome": ["ForbearanceAgreement"]
          }}
        ],
        "compliance_artifacts": [
          {{ "artifact_id": "Req_Verification", "label": "本人身份確認" }},
          {{ "artifact_id": "Req_MiniMiranda",  "label": "錄音告知聲明" }}
        ]
      }}

      催收對話內容:
      `{chunk}`

  decomposition:
    general: "You are a professional question decomposition expert specializing in\
      \ multi-hop reasoning.\nGiven the following ontology and the question, decompose\
      \ the complex question into 2-3 focused sub-questions and identify involved schema types.\n\nCRITICAL REQUIREMENTS:\n\
      1. Each sub-question must be:\n   - Specific and focused on a single fact or\
      \ relationship by identifing all entities, relationships, and reasoning steps\
      \ needed\n   - Answerable independently with the given ontology\n   - Explicitly\
      \ reference entities and relations from the original question\n   - Designed\
      \ to retrieve relevant knowledge for the final answer\n\n2. For simple questions\
      \ (1-2 hop), return the original question as a single sub-question\n3. Analyze the question and identify all schema types that might be involved\n4. Only return\
      \ a concise JSON object with sub_questions array and involved_types object.\n\nOntology:\n{ontology}\n\n\
      Question: {question}\n\nExample for complex question:\nOriginal: \"Which film\
      \ has the director died earlier, Ethnic Notions or Gordon Of Ghost City?\"\n\
      Output:\n{{\n  \"sub_questions\": [\n    {{\"sub-question\": \"Who is the director of Ethnic Notions?\"\
      }},\n    {{\"sub-question\": \"Who is the director of Gordon Of Ghost City?\"\
      }},\n    {{\"sub-question\": \"When did the director of Ethnic Notions die?\"\
      }},\n    {{\"sub-question\": \"When did the director of Gordon Of Ghost City\
      \ die?\"}}\n  ],\n  \"involved_types\": {{\n    \"nodes\": [\"creative_work\", \"person\"],\n    \"relations\": [\"directed_by\"],\n    \"attributes\": [\"name\", \"date\"]\n  }}\n}}\n\nExample for simple question:\nOriginal: \"What is the capital\
      \ of France?\"\nOutput:\n{{\n  \"sub_questions\": [\n    {{\"sub-question\": \"What is the capital\
      \ of France?\"}}\n  ],\n  \"involved_types\": {{\n    \"nodes\": [\"location\"],\n    \"relations\": [\"located_in\"],\n    \"attributes\": [\"name\"]\n  }}\n}}\n"
    novel: "你是一个专业的问题分解大师，请根据以下问题和图本体模式，将问题分解为2-3个子问题，并识别涉及的schema类型。\n   要求：\n   1. 每个子问题必须：\n \
      \     - 明确且专注于一个事实或关系，通过识别所有实体、关系和推理步骤\n      - 明确引用原始问题中的实体和关系\n      - 设计为检索最终答案所需的相关知识\n\
      \   2. 对于简单问题（1-2跳），返回原始问题作为单个子问题\n   3. 分析问题并识别所有可能涉及的schema类型\n   4. 返回一个JSON对象，包含sub_questions数组和involved_types对象。\n   \n   问题：{question}\n\
      \   \n   图本体模式：{ontology}\n   \n   示例：\n   原始问题：\\\"智取生辰纲事件中，PERSON#1的策略为什么能够成功\\\"\n\
      \   输出：\n   {{\n       \\\"sub_questions\\\": [\n           {{\\\"sub-question\\\": \\\"智取生辰纲中PERSON#1的策略是什么？\\\"}},\n  \
      \           {{\\\"sub-question\\\": \\\"智取生辰纲中的PERSON、LOCATION有什么特殊属性？\\\"}}\n       ],\n       \\\"involved_types\\\": {{\n           \\\"nodes\\\": [\\\"person\\\", \\\"event\\\", \\\"location\\\"],\n           \\\"relations\\\": [\\\"策划\\\", \\\"发生地\\\"],\n           \\\"attributes\\\": [\\\"绰号\\\", \\\"职位\\\", \\\"特长\\\"]\n       }}\n   }}\n   如果是简单问题，返回原始问题作为单个子问题。\n\
      \   原始问题：\\\"智取生辰纲事件中，PERSON#1是谁\\\"\n   输出：\n   {{\n       \\\"sub_questions\\\": [\n           {{\\\"sub-question\\\": \\\"\
      智取生辰纲事件中，PERSON#1是谁？\\\"}}\n       ],\n       \\\"involved_types\\\": {{\n           \\\"nodes\\\": [\\\"person\\\", \\\"event\\\"],\n           \\\"relations\\\": [\\\"参与\\\"],\n           \\\"attributes\\\": [\\\"name\\\"]\n       }}\n   }}\n"
    debt_collection: "你是信用卡催收对话问答分解专家。请根据以下债务催收本体模式，将问题分解为 2-3 个子问题，并识别涉及的 schema 类型。\n\n要求：\n1. 每个子问题必须：\n   - 明确且专注于一个事实或关系，识别所有实体、关系和推理步骤\n   - 明确引用原始问题中的实体和关系\n   - 设计为检索最终答案所需的相关知识\n2. 对于简单问题（1-2 跳），返回原始问题作为单个子问题\n3. 分析问题并识别所有可能涉及的 schema 类型\n4. 返回一个 JSON 对象，包含 sub_questions 数组和 involved_types 对象。\n\n问题：{question}\n\n图本体模式：{ontology}\n\n示例：\n原始问题：\"在 M1 逾期且失业的客户中，哪些说服策略对 Worried 型债务人最有效？\"\n输出：\n{{\n  \"sub_questions\": [\n    {{\"sub-question\": \"M1 逾期且失业的客户通常表现出哪些债务人画像？\"}},\n    {{\"sub-question\": \"Worried 型债务人容易接受哪些说服策略？\"}},\n    {{\"sub-question\": \"哪些说服策略在失业导致的财务困难场景中成功促成了还款承诺？\"}}\n  ],\n  \"involved_types\": {{\n    \"nodes\": [\"debtor_persona\", \"persuasion_strategy\", \"objection_category\", \"payment_commitment\"],\n    \"relations\": [\"susceptible_to\", \"triggered_in_stage\", \"resolved_by\", \"made_by\"],\n    \"attributes\": [\"persona_type\", \"principle_type\", \"objection_type\", \"commitment_status\"]\n  }}\n}}\n\n如果是简单问题，返回原始问题作为单个子问题。\n原始问题：\"客户本次逾期的原因是什么？\"\n输出：\n{{\n  \"sub_questions\": [\n    {{\"sub-question\": \"客户本次逾期的原因是什么？\"}}\n  ],\n  \"involved_types\": {{\n    \"nodes\": [\"hardship_event\", \"objection_category\"],\n    \"relations\": [\"caused_by\"],\n    \"attributes\": [\"hardship_type\"]\n  }}\n}}\n"
  retrieval:
    general: 'You are an expert knowledge assistant. Your task is to answer the question
      based on the provided knowledge context.


      1. Use ONLY the information from the provided knowledge context and try your
      best to answer the question.

      2. If the knowledge is insufficient, reject to answer the question.

      3. Be precise and concise in your answer

      4. For factual questions, provide the specific fact or entity name

      5. For temporal questions, provide the specific date, year, or time period


      Question: {question}


      Knowledge Context:

      {context}


      Answer (be specific and direct):

      '
    ircot: 'You are an expert knowledge assistant using iterative retrieval with chain-of-thought
      reasoning.


      Current Question: {current_query}


      Available Knowledge Context:

      {context}


      Previous Thoughts: {previous_thoughts}


      Step {step}: Please think step by step about what additional information you
      need to answer the question completely and accurately.


      Instructions:

      1. Analyze the current knowledge context and the question

      2. Think about what information might be missing or unclear

      3. If you have enough information to answer, in the end of your response, write
      "FINAL_ANSWER:" followed by your final answer

      4. If you need more information, in the end of your response, write a specific
      query begin with "NEW_QUERIES:" to retrieve additional relevant information

      5. Be specific and focused in your reasoning, and you can only return either 3 or 4 in your response.


      Your reasoning:

      '
    novel: '你是小说知识助手，你的任务是根据提供的小说知识库回答问题。

